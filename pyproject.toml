[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatlens"
version = "0.1.0"
description = "Vision-based street-level thermal intelligence"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.35",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<0.29",
  "python-multipart>=0.0.12,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
ml = ["onnxruntime>=1.19"]

[project.scripts]
heatlens-ingest = "heatlens.ingest.build:main"
heatlens-train = "heatlens.ml.train:main"
heatlens-evaluate = "heatlens.ml.evaluate:main"

[tool.setuptools.packages.find]
include = ["heatlens*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
